/* 게임 첫 화면: 그림은 캔버스, 단추와 표기만 글 */
#title{position:fixed;inset:0;pointer-events:none}
#title h1{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%)}
#title .go{font-size:var(--go1,20px);position:absolute;left:var(--startX,50%);top:var(--startY,40%);transform:translateX(-50%);min-height:max(48px,calc(var(--dot,2px)*16));padding:0 calc(var(--dot,2px)*9);pointer-events:auto}
#title .go:active{transform:translate(-50%,var(--dot,2px))}
#creditBtn{position:fixed;right:max(4px,env(safe-area-inset-right));bottom:var(--creditBottom,8px);z-index:22;width:44px;height:44px;min-height:44px;padding:0;border-width:var(--dot2,2px);font-size:var(--t4,12px)}
#creditShade{position:fixed;inset:0;z-index:21;background:rgba(43,37,64,.65);touch-action:none}
#creditPanel{position:absolute;right:8px;bottom:calc(var(--creditBottom,8px) + 52px);width:max-content;max-width:calc(100% - 16px);max-height:calc(100% - var(--creditBottom,8px) - 128px);overflow:auto;padding:12px;border:var(--dot2,2px) solid #2B2540;background:#F2D6A2;color:#2B2540;box-shadow:inset 0 var(--dot2,2px) 0 #FFF6E5,inset 0 calc(var(--dot2,2px)*-2) 0 #C99A6B;font-size:var(--t3,12px);line-height:1.5;overflow-wrap:break-word}
#creditPanel p{margin:0}
@media(max-height:420px){#creditPanel{padding:6px 10px;font-size:12px;line-height:1.25}}
/* 단계 지도 · 폭탄 칸 · 새 것 안내 */
#map{position:fixed;inset:0;pointer-events:none}
.node{position:absolute;margin:0;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;touch-action:manipulation}
.node:disabled{pointer-events:none;cursor:default}
.node:focus-visible{outline:var(--dot2,2px) solid #FFC23C}
#mapBack{position:fixed;left:var(--backX,8px);top:var(--menuTop,8px)}
#homeBtn{position:fixed;left:var(--backX,8px);top:var(--menuTop,8px);display:flex;align-items:center;justify-content:center;gap:6px;z-index:2;white-space:nowrap}
#homeBtn canvas{position:static;flex:none;transition:none}
#homeBtn.panel{left:8px;top:auto;bottom:8px}
#bombBtn{position:fixed;margin:0;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
#teach{text-wrap:balance;position:fixed;left:50%;top:calc(var(--dot,2px)*20);transform:translateX(-50%);width:max-content;max-width:94vw;padding:calc(var(--dot,2px)*2) calc(var(--dot,2px)*4);border:var(--dot2,2px) solid #FFC23C;background:#2B2540;color:#FFF6E5;font-size:var(--tt,14px);line-height:1.5;text-align:center;white-space:pre-line;pointer-events:none}
/* 끝 화면 */
#end{position:fixed;left:0;right:0;top:0;padding:var(--dot,2px) var(--fr,12px) calc(var(--dot,2px)*2);text-align:center;pointer-events:none;background:#3F3851;isolation:isolate}
#endBg{position:absolute;top:0;z-index:-1;transition:none}
#end h2{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:calc(var(--dot,2px)*17);margin:0;padding:0 calc(var(--dot,2px)*13) calc(var(--dot,2px)*5);font-size:var(--te,24px);font-weight:400;line-height:1.15;color:#2B2540;white-space:nowrap}
#end p{text-wrap:balance;white-space:pre-line;margin:2px 0 0;padding:0 10px;font-size:var(--t2,12px);line-height:1.2}
#end p:empty{display:none}
#end #endP{margin:0;font-size:var(--t1,28px);line-height:calc(var(--dot,2px)*12);color:#FFC23C;text-shadow:var(--dot2,1px) var(--dot2,1px) 0 #2B2540}
@media(orientation:portrait){#end{padding-top:50px}}
@media(max-height:420px){#end{bottom:0;padding-top:3vh}#end .btns{margin-top:3vh}}
#end .btns{margin-top:clamp(4px,1.6vh,14px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:auto}
#end .btns .go{white-space:nowrap}
#board{margin:clamp(3px,1.2vh,10px) auto 0;padding:0 6px}
/* 낮은 폰 가로의 끝 화면: 위에 판, 아래에 놀이 장면(대표 「안 1」). 조건은 view.js endTopPanel과 같아야 한다 */
@media(max-height:419.9px) and (min-width:640px){
#end:not(.card){bottom:auto;display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);grid-template-rows:minmax(var(--frameRow,0px),auto);column-gap:calc(var(--dot,2px)*3);align-items:center;padding:calc(var(--dot,2px)*3) calc(var(--dot,2px)*8) calc(var(--dot,2px)*2)}
#end:not(.card) h2{grid-column:1/3;justify-self:center;min-height:calc(var(--dot,2px)*10);padding-bottom:var(--dot,2px);align-self:start}
#end:not(.card) #endP{grid-column:1;grid-row:2}
#end:not(.card) #endS{grid-column:1;grid-row:3;margin:0}
#end:not(.card) #endW{grid-column:1;grid-row:4;margin:0;font-size:var(--t4,12px)}
#end:not(.card) #board{grid-column:2;grid-row:2/4;margin:0 auto}
#end:not(.card) .btns{grid-column:2;grid-row:4;margin-top:var(--dot,2px)}
#end:not(.card) .bc{line-height:1}
#end.wrongs #endW{grid-column:2;grid-row:2}#end.wrongs #board{grid-row:3}
}
/* 667×260 사이트 안: 판 아래 여백과 단추 위 여백을 빼서 깬 왕의 왕관이 판 뒤에 가리지 않게(5차 평가) */
@media(max-height:279.9px) and (min-width:640px){
#end:not(.card){padding-bottom:0}
#end:not(.card) .btns{margin-top:0}
}
#board .row{display:flex;justify-content:center;gap:clamp(2px,.8vw,7px);margin-bottom:clamp(2px,.7vh,6px)}
.bc{width:clamp(32px,min(9.2vw,9vh),72px);padding:clamp(1px,.5vh,5px) 0;border:var(--dot2,2px) solid #2B2540;line-height:1.1;font-size:var(--t3,12px);color:#FFF6E5;background:#564E68;box-shadow:inset 0 var(--dot2,2px) 0 #6C6280,inset 0 calc(var(--dot2,2px)*-1) 0 #3F3851}
.bc b,.bc i{display:block;font-style:normal;font-weight:400}
.bc.b1{background:#FDCD92;color:#2B2540;box-shadow:inset 0 var(--dot2,2px) 0 #FFE8BE,inset 0 calc(var(--dot2,2px)*-1) 0 #D68C64}
.bc.b2{background:#FFC23C;color:#2B2540;box-shadow:inset 0 var(--dot2,2px) 0 #FFE9A8,inset 0 calc(var(--dot2,2px)*-1) 0 #E28A2A}
.bc.new{animation:bcPop .36s steps(4) both;outline:var(--dot2,2px) solid #FFF6E5;outline-offset:calc(var(--dot2,2px)*-2)}
@keyframes bcPop{0%{transform:translateY(calc(var(--dot,2px)*-1))}100%{transform:none}}
/* 일시 정지 */
body:not([data-ui-state=play]) #pauseBtn{display:none}
#pauseBtn{position:fixed;right:max(8px,1vw);top:max(8px,1vh);min-width:44px;min-height:44px;padding:0 8px;font-size:var(--t3,12px);border:var(--dot2,2px) solid #2B2540;border-radius:0;background:#F2D6A2;color:#2B2540}
#pause{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vh,18px);background:rgba(43,37,64,.8)}
#pause h2{margin:0;font-size:var(--t1,24px);font-weight:400}
#pause .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style>
</head>
<body>
<canvas id="c" data-test="board"></canvas>
<button id="pauseBtn" data-test="pause-open" aria-label="일시 정지">멈춤</button>
<div id="title" data-test="title">
  <h1>와르르 돼지성</h1>
  <button class="go" id="start" data-test="start" hidden>시작</button>
</div>
<div id="map" data-test="map" hidden></div>
<button class="go sub" id="mapBack" data-test="map-back" hidden>뒤로</button>
<button id="bombBtn" data-test="bomb" aria-label="폭탄" hidden></button>
<div id="teach" data-test="teach" role="status" hidden></div>
<div id="load"><div id="loadScene" aria-hidden="true"><span class="floor"></span><span class="king"></span><span class="pig"></span><span class="pig second"></span></div><p id="loadMsg">불러오는 중</p><button class="go" id="reload" hidden>다시 불러오기</button></div>
<div id="end" data-test="end" hidden>
  <canvas id="endBg"></canvas>
  <h2 id="endT"></h2>
  <p id="endP" data-test="end-score"></p>
  <p id="endS"></p>

<script>
// 그림 묶음을 받기 전에도 놀이 화면과 같은 기기 화소 정수 배로 보인다.
(() => {
  const fit = () => {
    const w = innerWidth, h = innerHeight, d = devicePixelRatio || 1, wide = w > h * 1.05;
    const k = Math.max(1, Math.floor(Math.min(h / ((h < 420 ? 5 : 7) * 16 + (wide ? 12 : 30)), w / (wide ? 192 : 104)) * d));
    const s = document.documentElement.style;
    s.setProperty('--load-dot', k / d + 'px'); s.setProperty('--load-left', Math.round((Math.round(w * d) - 104 * k) / 2) / d + 'px');
  };
  fit(); addEventListener('resize', fit);
})();
</script>
