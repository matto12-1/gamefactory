<style>
  :root {

    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb0b0; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; word-break: keep-all; overflow-wrap: break-word; }

  #overlay { touch-action: none; }
  #bootNote { position: fixed; inset: 0; z-index: 90; display: grid; place-content: center; justify-items: center; gap: 16px; color: var(--ink); font: 700 24px/1.4 Galmuri11, sans-serif; text-align: center; }
  #bootRetry { min-height: 48px; padding: 0 24px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); font: inherit; cursor: pointer; }
  canvas.pix { image-rendering: pixelated; display: block; flex: none; }
  .sprite-box { display: grid; place-items: center; width: 100%; min-width: 0; }
  button { font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); min-height: 48px; min-width: 48px; padding: 0 16px; border: 2px solid #e7dcc3; border-radius: 16px; background: #fffbe9; box-shadow: 0 4px 0 #d9cfb6; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--coral); border-color: var(--coral); color: var(--ink); box-shadow: 0 4px 0 var(--coral-deep); }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #d9cfb6; }
  button.primary:active { box-shadow: 0 2px 0 var(--coral-deep); }
  button.big { min-height: 56px; font-size: 20px; padding: 0 28px; border-radius: 28px; }
  button.link { background: none; box-shadow: none; font-weight: 600; text-decoration: underline; color: var(--ink-soft); }
  .ico { width: 22px; height: 22px; flex: none; }

  /* 위 띠 */
  #hud { position: fixed; top: 0; left: 0; right: 0; height: var(--hud); display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0)); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .tasks { display: flex; gap: 6px; min-width: 0; }
  .task { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 14px; background: rgba(255,255,255,0.82); border: 2px solid rgba(38,65,77,0.12); max-width: calc((100vw - 440px) / 3); min-width: 0; }
  .task.done { border-color: var(--sage); background: #f2fbf6; }
  .task-pic { width: calc(var(--sprite-w) * var(--task-step) * 1px / .8); height: 48px; }
  .task-info { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .task-info .clue { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spot-chip { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--paper-soft); }
  .spot-chip .ico { width: 18px; height: 18px; }
  .slots { display: flex; gap: 4px; margin-left: auto; }
  .slot { width: 44px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.45); border: 2px dashed rgba(38,65,77,0.28); display: grid; place-items: center; }
  .slot.full { background: var(--paper); border: 2px solid #fff; }

  /* 좁거나 낮은 화면: 할 일 칸은 그림자와 자리 그림만(실마리 글은 시작 창 · 카드에 있다) */
  @media (max-width: 900px), (max-height: 500px) {
    :root { --hud: 50px; }

    .task { padding: 3px 6px; max-width: none; }
    .slot { width: 34px; height: 28px; }
  }
  @media (max-width: 1300px) { .task-pic { width: calc(var(--sprite-w) * var(--phone-task-step) * 1px / .8); height: max(40px, calc(var(--sprite-h) * 1px)); } }
  @media (max-width: 430px) {
    #hud { flex-wrap: wrap; height: auto; }
    .slots { margin-left: 0; }
  }

  /* 낚시꾼 말풍선 · 알림 · 떠오르는 말 · 팻말 · 돋보기 단추 */
  .bubble { position: fixed; display: flex; align-items: center; gap: 8px; max-width: min(340px, calc(100vw - 24px)); padding: 10px 14px; border-radius: 18px; background: var(--paper); box-shadow: 0 6px 18px rgba(38,65,77,0.2); font-size: var(--text); font-weight: 700; line-height: 1.35; white-space: pre-line; pointer-events: none; }
  .bubble::after { content: ""; position: absolute; left: -8px; top: var(--tail-y, 50%); transform: translateY(-50%); border: 8px solid transparent; border-left: 0; border-right-color: var(--paper); }
  .bubble.below::after { left: var(--tail-x, 50%); top: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top: 0; border-bottom-color: var(--paper); }
  .bubble .hand { width: 34px; height: 34px; color: var(--coral-deep); }
  .bubble.big { font-size: calc(var(--text) * 1.3); }
  .bubble.big .hand { width: 46px; height: 46px; }
  /* width: max-content — left:50%에 놓은 상자는 쓸 폭이 화면 반쪽으로 줄어 「할 일을 / 다 / 했어요!」처럼 꺾였다(2026-11-02). */
  .toast { width: max-content; position: fixed; top: calc(var(--hud) + 10px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 22px; background: var(--paper); box-shadow: 0 8px 22px rgba(38,65,77,0.22); font-size: var(--text); font-weight: 800; pointer-events: none; max-width: calc(100vw - 24px); }
  .toast .stamp { padding: 4px 10px; border-radius: 10px; border: 3px solid var(--coral); color: var(--coral-deep); transform: rotate(-6deg); }
  .toast.boss { background: #2f4650; color: #fff; }
  .toast.stamp .stamp, .toast.task { border-color: var(--sage); }
  .toast .coin { padding: 2px 10px; border-radius: 999px; background: #ffe6a6; color: #7a5200; white-space: nowrap; }
  #pop { position: fixed; transform: translate(-50%, -100%); font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink); pointer-events: none; white-space: nowrap; }
  @media (max-width: 1000px) { #pop { font-size: 28px; } }
  /* 「걸렸다!」: 화면 가운데 크게(19.3) */
  /* 자리(위아래)는 app이 물고기 · 판정 글자를 피해 고른다. 글자는 화면 폭에도 묶는다(폰 세로에서 「끌어올려!」가 화면 밖으로 나갔다). */
  #pop.big { left: 50% !important; top: 42%; transform: translate(-50%, -50%); font-size: min(clamp(32px, 12vh, 112px), 16vw); animation: hit-pop 0.6s ease-out both; }
  @keyframes hit-pop { 0% { transform: translate(-50%, -50%) scale(0.6); } 25% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }
  /* 승부 위 띠(19.5): 위 가운데, 폭은 가로 30% · 세로 70%. 승부 때는 할 일 칸을 접는다(소리 · 멈춤 단추는 남김) */
  #fightBar { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); width: 30vw; display: grid; gap: 2px; pointer-events: none; }
  [data-kind="tall"] #fightBar { width: 70vw; }
  .fb-row { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px; border-radius: 16px; background: rgba(255,253,246,0.92); border: 2px solid rgba(38,65,77,0.14); box-sizing: border-box; }
  .fb-pic { flex: none; display: grid; place-items: center; min-width: 32px; }
  .fb-hp { position: relative; flex: 1; min-width: 40px; height: 14px; border-radius: 8px; border: 2px solid var(--ink); background: #e3e9e4; overflow: hidden; }
  .fb-hp i { position: relative; display: block; height: 100%; background: var(--coral); transition: width 0.15s; }
  .fb-hp em { position: absolute; left: 0; top: 0; bottom: 0; background: #fff3c4; transition: width 0.4s ease-in 0.12s; }
  .fb-hp.hit { animation: hp-hit 0.22s ease-out; }
  .fb-hp.reel i { background: #ffd36a; transition: width 0.08s; }
  .fb-hp.reel { border-color: #b8860b; }
  .fb-hp.reel.draining { border-color: #bd5148; }
  .fb-hp.reel.draining i { background: #d67662; }
  .fb-mash { justify-self:center; font:700 16px Galmuri11; color:var(--ink); background:#fff3c4; padding:2px 8px; }
  .perfect-label { position:absolute; right:4px; bottom:4px; z-index:9; font:700 16px Galmuri11; line-height:1.25; color:#26414d; background:#ffd36a; padding:2px 6px; border:2px solid #88642c; white-space:nowrap; }
  #card .perfect-label { right:calc(7 * var(--dot)); bottom:calc(9 * var(--dot)); }
  /* 폰은 딱지가 그림 칸에 비해 크다. 딱지가 있을 때만 그림 칸 아래를 비워 생물을 위로 올린다. */
  @media (max-width:1199px),(max-height:699px) { #card .card-pic:has(> .perfect-label) { padding-bottom:calc(27 * var(--dot)); } }
  .card-pic,.sticker-scene { position:relative; }
  @keyframes hp-hit { 0% { transform: translateX(-3px) scaleY(1.3); } 50% { transform: translateX(3px); } 100% { transform: none; } }
  .fb-pips { flex: none; display: flex; gap: 4px; }
  .fb-pips b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-soft); background: #fff; box-sizing: border-box; }
  .fb-pips b.on { border-color: var(--coral-deep); background: var(--coral-deep); }
  /* 연속 맞힘(2026-10-27): 왼쪽 가운데 큰 숫자. 자리는 app drawCombo가 정한다. 맞힐 때마다 톡, 5연속째마다 금빛으로 크게, 놓치면 회색으로 흔들림. */
  #combo { position: fixed; left: 16px; top: 42%; display: grid; justify-items: center; line-height: 1; pointer-events: none; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink); }
  #combo b { font: 700 clamp(44px, 9vh, 88px)/1 "Galmuri11", "Pretendard", sans-serif; }
  #combo span { font: 800 clamp(16px, 3vh, 26px)/1.15 "Pretendard", sans-serif; }
  #combo.pop { animation: combo-pop 0.22s ease-out; }
  #combo.big { color: #ffd36a; animation: combo-big 0.4s ease-out; }
  #combo.miss { color: #c9d1d5; animation: combo-miss 0.3s ease-out; }
  @keyframes combo-pop { 0% { transform: scale(1.35); } 100% { transform: none; } }
  @keyframes combo-big { 0% { transform: scale(1.35); } 60% { transform: scale(0.95); } 100% { transform: none; } }
  @keyframes combo-miss { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #hud.fighting .tasks { display: none; }
  /* 낮은 화면: 위 띠를 얇게(원 줄 자리를 덜 먹게) */
  @media (max-height: 520px) { .fb-row { min-height: 36px; padding: 2px 8px; } }
  /* 톡 단추(19.5): 오른쪽 아래 둥근 단추, 지름은 64px와 화면 높이 12% 중 큰 것. 원 줄이 그 자리에 오면 왼쪽 아래로 옮긴다 */
  #tapBtn { position: fixed; right: 16px; bottom: 16px; width: max(64px, 12vh); height: max(64px, 12vh); padding: 0; border-radius: 50%; border: 3px solid var(--coral-deep); background: var(--coral); box-shadow: 0 5px 0 var(--coral-deep); color: var(--ink); font-size: max(22px, 4vh); font-weight: 900; }
  #tapBtn.left { right: auto; left: 16px; }
  #tapBtn.flash { animation: tap-flash 0.18s ease-out; }
  /* 맞힌 결과 고리(2026-10-27): 맞힘 흰색 · 최고 금빛 · 놓침 회색에 흔들림. 끌어올려! 동안은 금빛 고리가 뛴다. 누름 번쩍임(flash)과 따로 돈다. */
  #tapBtn::before, #tapBtn::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 4px solid transparent; pointer-events: none; }
  #tapBtn.hit::after { --ring: #ffffff; animation: tap-ring 0.3s ease-out; }
  #tapBtn.best::after { --ring: #ffd36a; animation: tap-ring 0.36s ease-out; }
  #tapBtn.miss::after { --ring: #9aa6ad; animation: tap-ring 0.25s ease-out; }
  #tapBtn.miss { animation: tap-miss 0.25s ease-out; }
  #tapBtn.mash::before { border-color: #ffd36a; animation: tap-mash 0.4s ease-in-out infinite; }
  @keyframes tap-ring { 0% { border-color: var(--ring); transform: scale(0.9); opacity: 1; } 100% { border-color: var(--ring); transform: scale(1.45); opacity: 0; } }
  @keyframes tap-miss { 0%, 100% { transform: none; } 30% { transform: translateX(-6px); background: #9aa6ad; } 70% { transform: translateX(6px); } }
  @keyframes tap-mash { 50% { transform: scale(1.14); opacity: 0.35; } }
  @keyframes tap-flash { 0% { background: #fff3c4; transform: translateY(3px) scale(0.94); box-shadow: 0 2px 0 var(--coral-deep); } 100% { background: var(--coral); transform: none; } }
  body.reduce #pop.big, body.reduce #tapBtn.flash, body.reduce #tapBtn.miss, body.reduce #tapBtn.hit::after, body.reduce #tapBtn.best::after, body.reduce #tapBtn.miss::after, body.reduce #tapBtn.mash::before, body.reduce #combo.pop, body.reduce #combo.big, body.reduce #combo.miss, body.reduce .fb-hp.hit { animation: none; }
  #signs { position: fixed; inset: 0; pointer-events: none; }
  .sign { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 6px; border-radius: 12px; background: rgba(255,255,255,0.78); font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .sign .ico { width: 18px; height: 18px; }
  .sign.bounce { animation: bounce 0.5s ease-out; }
  .sign.boss { background: #2f4650; color: #fff; }
  @keyframes bounce { 0% { transform: translate(-50%, -100%) scale(1); } 35% { transform: translate(-50%, -130%) scale(1.12); } 100% { transform: translate(-50%, -100%) scale(1); } }
  #lookBtn { position: fixed; transform: translate(-50%, -100%); width: 52px; height: 52px; padding: 0; border-radius: 26px; display: grid; place-items: center; background: #fffbe9; border: 3px solid var(--gold); }
  #lookBtn .ico { width: 28px; height: 28px; }
  #lookBtn:active { transform: translate(-50%, -100%) translateY(2px); }
  body.reduce .sign.bounce { animation: none; }

  /* 판 위 창들 */
  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 20px)); max-height: calc(100vh - 24px); overflow: auto; padding: 18px 20px; border: 2px solid #e7dcc3; border-radius: 20px; background: var(--paper); box-shadow: 0 6px 0 rgba(38,65,77,.12); font-size: var(--text); }
  .panel h2 { margin: 0 0 8px; font-size: max(20px, 1.35em); font-weight: 900; }
  .panel p { margin: 4px 0; line-height: 1.45; }
  /* 긴 판(도감 · 지도)은 제목 줄과 돌아가기 단추가 위에 붙어 있다 */
  .panel-head { position: sticky; top: -18px; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -18px -20px 6px; padding: 12px 20px 8px; background: var(--paper); }
  .panel-head h2 { margin: 0; }
  #card { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: center; }
  #card .badge { color: var(--coral-deep); font-weight: 800; margin: 0; }
  #card .size { font-size: max(14px, 0.8em); color: var(--ink-soft); }
  #card .record, #card .big-stamp { margin-left: 8px; font-size: 0.6em; padding: 2px 8px; border-radius: 8px; background: #fff1d8; color: #b37a14; vertical-align: middle; }
  .card-pic { display: grid; place-items: center; height: clamp(96px, 16vh, 180px); min-width: 0; border-radius: 16px; background: #e5f2ef; }
  .card-lines .lived { font-weight: 800; }
  .card-act .ask { font-weight: 800; margin-top: 8px; }
  .homes, .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .home, .option { display: grid; justify-items: center; gap: 4px; min-height: 76px; padding: 8px 6px; border-radius: 16px; background: #fffbe9; border: 2px solid #e7dcc3; font-size: max(14px, 0.95em); line-height: 1.25; }
  .home .ico { width: 32px; height: 32px; }
  .home.glow { border-color: var(--gold); animation: glow 1.2s ease-in-out infinite; }
  body.reduce .home.glow { animation: none; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(233,178,63,0.35); } }
  .opt-pic { image-rendering: pixelated; }
  .home.tried { opacity: .45; border-style: dashed; }
  .answer.right { color: var(--sage-deep); font-weight: 800; }
  .answer.wrong { color: var(--coral-deep); font-weight: 800; }
  #start { text-align: center; }
  #start .sub { color: var(--ink-soft); }
  .start-tasks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
  .start-task { display: grid; justify-items: center; gap: 6px; padding: 10px 6px; border-radius: 16px; background: var(--paper-soft); }
  .start-task .sprite-box { height: 64px; }
  .start-task p { display: flex; align-items: center; gap: 4px; font-size: max(14px, 0.85em); font-weight: 700; margin: 0; }
  #start .tip { font-size: 14px; color: var(--ink-soft); }
  #title { position: fixed; inset: 0; }
  .title-card { display: grid; justify-items: center; gap: 14px; padding: 0 16px; padding-top: max(24px, 5vh); text-align: center; }
  .title-card h1 { display: grid; gap: 14px; margin: 0; font-weight: 900; letter-spacing: -0.04em; line-height: 1.3; color: var(--ink); }
  .title-card h1 span { display: block; paint-order: stroke fill; -webkit-text-stroke: 4px #fffbe9; text-shadow: 0 4px 0 #fffbe9, 0 8px 0 rgba(38,65,77,.18); }
  .title-kicker { font-size: clamp(36px, 6vh, 60px); color: var(--coral); }
  .title-name { font-size: clamp(64px, 11vh, 120px); }
  /* 부제는 그림 위에서도 읽히게 크림 띠 위에(아이 화면 검수 2026-10-27: 물 그림 위 대비가 모자랐다) */
  .title-card .sub { margin: 0; color: var(--ink); font-size: clamp(15px, 2.2vh, 22px); font-weight: 700; padding: 6px 16px; border-radius: 999px; background: rgba(255,251,233,.92); }
  .title-card [data-act="play"] { min-width: 260px; min-height: 60px; }
  /* 아래 줄은 큰 단추 바로 밑 흐름에 둔다(바닥에 붙이면 사파리 폰에서 도구 막대에 밀려 쏠렸다) */
  .title-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .title-card .safe { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); padding: 4px 12px; border-radius: 8px; background: rgba(255,251,233,.92); }
  .places { display: grid; gap: 8px; margin: 10px 0; }
  .place { display: grid; justify-items: start; gap: 4px; min-height: 72px; padding: 12px 16px; border-radius: 18px; text-align: left; background: var(--paper-soft); }
  .place span { font-weight: 600; font-size: max(14px, 0.85em); color: var(--ink-soft); }
  .place .marks { display: flex; flex-wrap: wrap; gap: 6px; }
  .place .marks i { font-style: normal; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.8); }
  .place.fog { background: repeating-linear-gradient(135deg, #e7eef0, #e7eef0 10px, #dde7ea 10px, #dde7ea 20px); }
  /* 물길 지도 그림(ui.mjs renderMap): 지도 크기에 판을 맞추고, 이름표는 지도 위 곳 점 옆에 뜬다. */
  #map.map-panel { width: auto; max-width: calc(100vw - 20px); padding: 12px; overflow: hidden; }
  #map.map-panel .panel-head { position: static; margin: 0 0 8px; padding: 0; background: none; }
  .map-box { position: relative; margin: 0 auto; border-radius: 10px; overflow: hidden; }
  .map-pic { display: block; image-rendering: auto; }
  .map-pic[data-crisp="true"] { image-rendering: pixelated; }
  .map-box .place { position: absolute; width: max-content; max-width: min(240px, 46%); min-height: 48px; padding: 6px 12px; gap: 2px; border: 2px solid #e7dcc3; border-radius: 14px; background: rgba(255, 251, 233, 0.96); box-shadow: 0 3px 0 rgba(38, 65, 77, 0.28); font-size: 15px; line-height: 1.25; }
  .map-box .place.play { border: 3px solid var(--coral); }
  .map-box .place:disabled { opacity: 1; background: rgba(237, 244, 239, 0.95); }
  .map-box .place .marks { gap: 4px; }
  .map-box .place .marks i { padding: 1px 6px; font-size: 13px; background: #f3ead2; }
  .map-box .place .lock { font-size: 13px; }
  .map-box .place .go { color: #a95726; font-size: 14px; font-weight: 800; }
  /* 폰 세로 시작 창: 그림자와 실마리를 한 줄씩(세 칸이면 실마리가 몇 글자씩 꺾였다) */
  @media (max-width: 480px) {
    .start-tasks { grid-template-columns: 1fr; gap: 6px; }
    .start-task { grid-template-columns: 84px minmax(0, 1fr); align-items: center; justify-items: start; padding: 6px 10px; text-align: left; }
    .start-task .sprite-box { height: 56px; }
  }
  /* 큰 화면(노트북 1695x902 등): 판 · 글 · 단추 · 위 띠를 키운다(아이 화면 검수 2026-10-27: 카드가 화면의 3분의 1, 글 14px이 멀리서 안 읽혔다) */
  @media (min-width: 1200px) and (min-height: 760px) {
    :root { --hud: 84px; --text: 24px; }
    button { font-size: 19px; min-height: 52px; }
    button.big { min-height: 72px; font-size: 26px; padding: 0 40px; border-radius: 36px; }
    .icon-btn { min-width: 56px; min-height: 56px; }
    .icon-btn svg { width: 28px; height: 28px; }
    .task { max-width: calc((100vw - 540px) / 3); padding: 6px 14px 6px 8px; }
    .task-pic { height: 64px; }
    .task-info .clue { font-size: 19px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; }
    .spot-chip { width: 32px; height: 32px; }
    .spot-chip .ico { width: 22px; height: 22px; }
    .slot { width: 64px; height: 48px; border-radius: 12px; }
    .sign { font-size: 18px; padding: 4px 11px 4px 8px; }
    .sign .ico { width: 22px; height: 22px; }
    .panel { width: min(880px, 54vw); padding: 24px 30px; }
    .panel-head { top: -24px; margin: -24px -30px 8px; padding: 16px 30px 10px; }
    #start .tip { font-size: 18px; }
    .start-task p { font-size: 20px; }
    .start-task .sprite-box { height: 96px; }
    #card { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); column-gap: 26px; text-align: left; align-items: start; }
    #card .card-top { grid-column: 1 / -1; }
    #card .card-pic { grid-column: 1; grid-row: 2 / span 2; height: clamp(220px, 34vh, 320px); }
    #card .card-lines { grid-column: 2; grid-row: 2; }
    #card .card-act { grid-column: 2; grid-row: 3; }
    .home, .option { min-height: 96px; font-size: 20px; }
    .home .ico { width: 40px; height: 40px; }
    .title-card .safe { font-size: 18px; }
    #map.map-panel { padding: 16px; }
    .map-box .place { padding: 8px 14px; font-size: 19px; }
    .map-box .place .marks i, .map-box .place .lock { font-size: 16px; }
    .map-box .place .go { font-size: 17px; }
  }
  @media (max-width: 599px) {
    .title-card { padding-top: 8vh; gap: 16px; }
    .title-card .sub { white-space: nowrap; }
    .map-box .place { max-width: 56%; padding: 4px 8px; font-size: 14px; }
    .map-box .place .marks i, .map-box .place .lock { font-size: 12px; }
    .map-box .place .go { font-size: 13px; }
  }

  /* 낮은 가로 화면(폰 가로): 판이 넘치지 않게 두 칸으로 놓고 여백을 줄인다 */
  @media (max-height: 520px) and (min-width: 600px) {
    #bubble { max-width: 300px; font-size: 14px; line-height: 1.15; padding: 6px 10px; gap: 6px; }
    #bubble .hand { width: 24px; height: 24px; }
    .panel { padding: 12px 16px; max-height: calc(100vh - 12px); }
    .panel h2 { font-size: 20px; margin-bottom: 4px; }
    .panel-head { top: -12px; margin: -12px -16px 4px; padding: 8px 16px 6px; }
    button.big { min-height: 48px; font-size: 18px; }
    .title-card { padding: 10px 16px; gap: 10px; }
    .title-card h1 { display: flex; align-items: center; gap: 12px; }
    .title-kicker { font-size: 32px; }
    .title-name { font-size: 44px; }
    .title-row { bottom: 42px; }
    .title-card .safe { bottom: 6px; }
    /* 지도: 제목 줄을 왼쪽 세로 칸으로 옮겨 지도에 높이를 다 준다. */
    #map.map-panel { display: grid; grid-template-columns: auto auto; column-gap: 12px; align-items: start; padding: 8px 10px; }
    #map.map-panel .panel-head { flex-direction: column; align-items: flex-start; margin: 0; }
    .map-box .place { min-height: 44px; padding: 3px 8px; font-size: 13px; }
    .map-box .place .marks i, .map-box .place .lock { font-size: 12px; }
    .map-box .place .go { font-size: 12px; }
  }
  /* 좁은 위 띠는 실마리를 시작 창에서 읽고, 놀이 중에는 그림과 자리 그림을 쓴다. */
  @media (max-width: 1500px) { .task-info .clue { display: none; } .task { max-width: none; } }
  @media (max-height: 520px) and (min-width: 600px) {
    /* 낮은 가로 화면 카드는 세 칸: 그림 · 글 · 단추(세로로 쌓아 화면 안에, 디자인 검수 2026-10-27: 단추가 아래로 잘렸다) */
    #card { grid-template-columns: 150px minmax(0, 1fr) 220px; grid-auto-rows: auto; gap: 2px 12px; padding: 10px 14px; text-align: left; align-items: start; width: calc(100vw - 20px); }
    #card .card-top { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; }
    #card .card-top h2 { margin: 0; }
    #card .card-pic { grid-column: 1; grid-row: 2 / span 3; height: 96px; }
    #card .card-lines, #card .card-act > p { grid-column: 2; }
    #card .card-lines p, #card .card-act > p { margin: 1px 0; }
    #card .card-act { display: contents; }
    #card .homes, #card .options { grid-column: 3; grid-row: 2 / span 3; grid-template-columns: 1fr; gap: 6px; margin: 0; }
    #card .home, #card .option { grid-template-columns: auto 1fr; justify-items: start; align-items: center; min-height: 44px; padding: 4px 10px; text-align: left; }
    #card .home .ico { width: 24px; height: 24px; }
  }
  @media (max-width: 430px) {
    #bubble { max-width: 200px; font-size: 16px; padding: 8px 10px; gap: 6px; }
    #bubble .hand { width: 22px; height: 22px; }
  }
  #bubble.long { width: min(320px, calc(100vw - 32px)); min-width: min(320px, calc(100vw - 32px)); max-width: min(340px, calc(100vw - 32px)); }
  #toast > span, #bubble > span { min-width: 0; }
  /* 알림 글은 문장마다 한 줄, 그래도 길면 고르게 꺾는다. 상자는 가장 긴 문장 폭(화면을 넘지 않게). */
  #toast { max-width: min(600px, calc(100vw - 32px)); }
  /* 아래 띠: 레벨 · 경험치 · 조개(2026-11-03). 작게, 찌 · 물고기 자리를 가리지 않게 맨 아래 가장자리. */
  #growthBar { position: fixed; left: 50%; bottom: max(4px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 999px; background: rgba(255,253,246,0.82); color: var(--ink); font-size: 12px; line-height: 1; pointer-events: none; white-space: nowrap; z-index: 5; }
  #hud[hidden] ~ #growthBar { display: none; }
  #growthBar .gb-xp { position: relative; width: clamp(80px, 18vw, 200px); height: 5px; border-radius: 3px; background: rgba(38,65,77,0.16); overflow: hidden; }
  #growthBar .gb-xp i { position: absolute; inset: 0 auto 0 0; background: var(--sage); }
  #growthBar .gb-shells { position: relative; color: var(--coral-deep); }
  #growthBar .gb-shells.gain::after { content: attr(data-gain); position: absolute; left: 100%; bottom: 0; margin-left: 4px; color: var(--gold); animation: gb-gain 0.9s ease-out forwards; }
  @keyframes gb-gain { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { #growthBar .gb-shells.gain::after { animation: none; opacity: 0; } }
  #toast .toast-text > span { display: block; text-wrap: balance; }
  /* 관찰 알림: 도장과 이름이 첫 줄, 설명은 문장마다 한 줄로 도장 왼쪽 끝에 맞춘다. 길면 낱말 사이에서 고르게 끊는다(대표 2026-11-02). */
  #toast.observe { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; row-gap: 0; width: max-content; min-width: 0; max-width: calc(100vw - 32px); padding: calc(8 * var(--dot)) calc(10 * var(--dot)); }
  #toast.observe .stamp, #toast.observe .toast-name { margin-bottom: 6px; }
  #toast.observe .toast-line { grid-column: 1 / -1; word-break: keep-all; text-wrap: balance; color: var(--ink-soft); }
