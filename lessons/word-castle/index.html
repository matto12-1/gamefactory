   종이 · 단추 변수를 새 조각과 --u로 다시 정해 정비 카드 · 창 · 단추도 함께 바뀐다. 그림 테두리 폭(border-image 넷째 값)은 상자 테두리보다 클 수 있다(그림이 안쪽으로 겹침). */

 --paper-sm:var(--k-paper) 44 52 45 52 fill / calc(var(--u)*30) calc(var(--u)*36) calc(var(--u)*31) calc(var(--u)*36) round;
 --blue:var(--k-btn-blue) 47 45 47 45 fill / calc(var(--u)*47) calc(var(--u)*45) round;
